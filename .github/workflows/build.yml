name: Build Android APK for x86 & API 17

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"

    - name: Ensure Minimal Resource Directory
      run: |
        mkdir -p app/src/main/res/values
        echo '<resources><string name="app_name">异次元漫画</string></resources>' > app/src/main/res/values/strings.xml

    - name: Set up Gradle 6.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '6.5'
        validate-wrappers: false

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: comic-reader-x86-api17
        path: app/build/outputs/apk/debug/app-debug.apk
