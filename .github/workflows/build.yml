name: Build Android APK for x86 & API 17

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Android SDK Platform 28
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"

    - name: Set up Gradle 6.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '6.5'
        validate-wrappers: false

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: comic-reader-x86-api17
        path: app/build/outputs/apk/debug/app-debug.apk
